<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <style>
    text { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }

    /* ---------- main card typing lines ---------- */
    .ln { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); }
    .ln1 { animation: ln1 8s linear infinite; }
    .ln2 { animation: ln2 8s linear infinite; }
    .ln3 { animation: ln3 8s linear infinite; }
    .ln4 { animation: ln4 8s linear infinite; }
    .ln5 { animation: ln5 8s linear infinite; }
    .ln6 { animation: ln6 8s linear infinite; }
    @keyframes ln1 { 0%,2%{transform:scaleX(0)} 7%,92%{transform:scaleX(1)} 97%,100%{transform:scaleX(0)} }
    @keyframes ln2 { 0%,8%{transform:scaleX(0)} 13%,92%{transform:scaleX(1)} 97%,100%{transform:scaleX(0)} }
    @keyframes ln3 { 0%,14%{transform:scaleX(0)} 19%,92%{transform:scaleX(1)} 97%,100%{transform:scaleX(0)} }
    @keyframes ln4 { 0%,22%{transform:scaleX(0)} 27%,92%{transform:scaleX(1)} 97%,100%{transform:scaleX(0)} }
    @keyframes ln5 { 0%,30%{transform:scaleX(0)} 35%,92%{transform:scaleX(1)} 97%,100%{transform:scaleX(0)} }
    @keyframes ln6 { 0%,38%{transform:scaleX(0)} 43%,92%{transform:scaleX(1)} 97%,100%{transform:scaleX(0)} }

    /* ---------- typing cursor ---------- */
    .curM { animation: curM 8s linear infinite; }
    @keyframes curM {
      0%,8%   { transform: translate(0px, 0px); }
      9%,14%  { transform: translate(-100px, 52px); }
      15%,21% { transform: translate(60px, 104px); }
      22%,29% { transform: translate(-180px, 156px); }
      30%,37% { transform: translate(-40px, 208px); }
      38%,92% { transform: translate(-260px, 260px); }
      97%,100%{ transform: translate(0px, 0px); }
    }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

    /* ---------- ping ---------- */
    .pingDot { opacity: 0; animation: pingDot 8s linear infinite; }
    @keyframes pingDot { 0%,8%{opacity:0} 10%{opacity:1} 12%{opacity:.2} 14%{opacity:1} 18%,100%{opacity:0} }
    .ring1 { animation: ring1 8s linear infinite; }
    .ring2 { animation: ring2 8s linear infinite; }
    @keyframes ring1 { 0%,10%{r:0px;opacity:0} 11%{r:24px;opacity:.9} 22%{r:780px;opacity:0} 23%,100%{r:0px;opacity:0} }
    @keyframes ring2 { 0%,13%{r:0px;opacity:0} 14%{r:24px;opacity:.8} 25%{r:780px;opacity:0} 26%,100%{r:0px;opacity:0} }

    /* ---------- model chips ---------- */
    .chip { animation: chipOn 8s linear infinite; }
    @keyframes chipOn { 0%,14%{opacity:.35} 18%,84%{opacity:1} 92%,100%{opacity:.35} }
    .spinWrap { opacity: 0; animation: spinWrap 8s linear infinite; }
    @keyframes spinWrap { 0%,15%{opacity:0} 18%,36%{opacity:1} 44%,100%{opacity:0} }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    /* ---------- opinion cards ---------- */
    .cardC { animation: cardC 8s ease-in-out infinite; }
    @keyframes cardC {
      0%,26% { transform: translateX(620px); opacity: 0; }
      36%,86%{ transform: translateX(0px);   opacity: 1; }
      94%,100%{ transform: translateX(620px); opacity: 0; }
    }
    .cardV { animation: cardV 8s ease-in-out infinite; }
    @keyframes cardV {
      0%,30% { transform: translateX(620px); opacity: 0; }
      40%,88%{ transform: translateX(0px);   opacity: 1; }
      96%,100%{ transform: translateX(620px); opacity: 0; }
    }

    /* ---------- compare glow ---------- */
    .halo { opacity: 0; animation: glow 8s linear infinite; }
    @keyframes glow {
      0%,46%{opacity:0} 52%{opacity:.9} 58%{opacity:.25}
      64%{opacity:.9} 70%{opacity:.25} 76%{opacity:.8} 84%,100%{opacity:0}
    }
  </style>

  <!-- background -->
  <rect width="1920" height="1080" fill="#08090d"/>

  <!-- title -->
  <text x="80" y="118" font-size="50" font-weight="700" fill="#eef1f6">/fh-opinion</text>

  <!-- ping rings from main answer edge (ripple rightward toward chips) -->
  <clipPath id="rightSide">
    <rect x="908" y="0" width="1012" height="1080"/>
  </clipPath>
  <g clip-path="url(#rightSide)">
    <circle class="ring1" cx="905" cy="560" r="0" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <circle class="ring2" cx="905" cy="560" r="0" fill="none" stroke="#38bdf8" stroke-width="4"/>
  </g>
  <circle class="pingDot" cx="905" cy="560" r="11" fill="#38bdf8"/>

  <!-- ===================== MAIN builder card ===================== -->
  <g transform="translate(120,220)">
    <rect class="halo" x="-10" y="-10" width="800" height="700" rx="30" fill="none" stroke="#F59E0B" stroke-width="6"/>
    <rect width="780" height="680" rx="24" fill="#0d1016" stroke="#F59E0B" stroke-width="4"/>
    <text x="40" y="70" font-size="38" font-weight="700" fill="#F59E0B">&#9650; MAIN</text>
    <line x1="40" y1="100" x2="740" y2="100" stroke="#1b212c" stroke-width="3"/>

    <!-- answer lines typing in -->
    <g transform="translate(40,150)">
      <rect class="ln ln1" x="0" y="0"   width="540" height="20" rx="10" fill="#eef1f6" opacity="0.85"/>
      <rect class="ln ln2" x="0" y="52"  width="440" height="20" rx="10" fill="#eef1f6" opacity="0.85"/>
      <rect class="ln ln3" x="0" y="104" width="600" height="20" rx="10" fill="#eef1f6" opacity="0.85"/>
      <rect class="ln ln4" x="0" y="156" width="360" height="20" rx="10" fill="#eef1f6" opacity="0.85"/>
      <rect class="ln ln5" x="0" y="208" width="500" height="20" rx="10" fill="#eef1f6" opacity="0.85"/>
      <rect class="ln ln6" x="0" y="260" width="280" height="20" rx="10" fill="#F59E0B" opacity="0.9"/>
    </g>

    <!-- typing cursor -->
    <g class="curM">
      <rect class="blink" x="592" y="144" width="16" height="30" rx="3" fill="#F59E0B"/>
    </g>
  </g>

  <!-- ===================== model chips (right) ===================== -->
  <g class="chip">
    <g transform="translate(1560,300)">
      <rect width="290" height="96" rx="20" fill="#0f131a" stroke="#22D3EE" stroke-width="4"/>
      <text x="40" y="63" font-size="40" fill="#22D3EE">&#9679;</text>
      <g class="spinWrap">
        <circle class="spin" cx="228" cy="48" r="26" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" stroke-dasharray="42 122"/>
      </g>
    </g>
  </g>
  <g class="chip">
    <g transform="translate(1560,684)">
      <rect width="290" height="96" rx="20" fill="#0f131a" stroke="#A78BFA" stroke-width="4"/>
      <text x="40" y="63" font-size="40" fill="#A78BFA">&#9670;</text>
      <g class="spinWrap">
        <circle class="spin" cx="228" cy="48" r="26" fill="none" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" stroke-dasharray="42 122"/>
      </g>
    </g>
  </g>

  <!-- ===================== opinion card: cyan ===================== -->
  <g class="cardC">
    <g transform="translate(960,280)">
      <rect class="halo" x="-9" y="-9" width="478" height="278" rx="26" fill="none" stroke="#22D3EE" stroke-width="5"/>
      <rect width="460" height="260" rx="20" fill="#0f131a" stroke="#22D3EE" stroke-width="4"/>
      <text x="32" y="58" font-size="30" font-weight="700" fill="#22D3EE">&#9679; OPINION</text>
      <line x1="32" y1="84" x2="428" y2="84" stroke="#1b212c" stroke-width="3"/>
      <rect x="32" y="112" width="330" height="14" rx="7" fill="#22D3EE" opacity="0.5"/>
      <rect x="32" y="146" width="260" height="14" rx="7" fill="#22D3EE" opacity="0.5"/>
      <rect x="32" y="180" width="300" height="14" rx="7" fill="#22D3EE" opacity="0.5"/>
      <text x="32" y="236" font-size="21" fill="#22D3EE">read-only</text>
    </g>
  </g>

  <!-- ===================== opinion card: violet ===================== -->
  <g class="cardV">
    <g transform="translate(960,600)">
      <rect class="halo" x="-9" y="-9" width="478" height="278" rx="26" fill="none" stroke="#A78BFA" stroke-width="5"/>
      <rect width="460" height="260" rx="20" fill="#0f131a" stroke="#A78BFA" stroke-width="4"/>
      <text x="32" y="58" font-size="30" font-weight="700" fill="#A78BFA">&#9670; OPINION</text>
      <line x1="32" y1="84" x2="428" y2="84" stroke="#1b212c" stroke-width="3"/>
      <rect x="32" y="112" width="310" height="14" rx="7" fill="#A78BFA" opacity="0.5"/>
      <rect x="32" y="146" width="350" height="14" rx="7" fill="#A78BFA" opacity="0.5"/>
      <rect x="32" y="180" width="240" height="14" rx="7" fill="#A78BFA" opacity="0.5"/>
      <text x="32" y="236" font-size="21" fill="#A78BFA">read-only</text>
    </g>
  </g>
</svg>
