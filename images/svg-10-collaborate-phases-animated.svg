<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family='ui-monospace, "SF Mono", Menlo, monospace'>
  <style>
    :root { }
    .t  { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

    /* ---- highlight band sweep ---- */
    @keyframes band {
      0%, 21%   { transform: translateX(0px);    opacity: 1; }
      25%, 46%  { transform: translateX(453px);  opacity: 1; }
      50%, 71%  { transform: translateX(906px);  opacity: 1; }
      75%, 94%  { transform: translateX(1359px); opacity: 1; }
      97%       { transform: translateX(1359px); opacity: 0; }
      99%       { transform: translateX(0px);    opacity: 0; }
      100%      { transform: translateX(0px);    opacity: 1; }
    }
    #band { animation: band 8s linear infinite; }

    /* ---- PROPOSE: cards fire from chips in parallel ---- */
    @keyframes propA {
      0%, 2%   { opacity: 0; transform: translateX(-120px); }
      8%       { opacity: 1; transform: translateX(0); }
      94%      { opacity: 1; transform: translateX(0); }
      98%,100% { opacity: 0; transform: translateX(-120px); }
    }
    @keyframes propB {
      0%, 4%   { opacity: 0; transform: translateX(-120px); }
      10%      { opacity: 1; transform: translateX(0); }
      94%      { opacity: 1; transform: translateX(0); }
      98%,100% { opacity: 0; transform: translateX(-120px); }
    }
    @keyframes propC {
      0%, 6%   { opacity: 0; transform: translateX(-120px); }
      12%      { opacity: 1; transform: translateX(0); }
      94%      { opacity: 1; transform: translateX(0); }
      98%,100% { opacity: 0; transform: translateX(-120px); }
    }
    #propA { animation: propA 8s linear infinite; }
    #propB { animation: propB 8s linear infinite; }
    #propC { animation: propC 8s linear infinite; }

    @keyframes roLbl {
      0%, 8%   { opacity: 0; }
      12%      { opacity: 1; }
      94%      { opacity: 1; }
      98%,100% { opacity: 0; }
    }
    #roLbl { animation: roLbl 8s linear infinite; }

    /* ---- PLAN: proposals converge on the architect, ONE DAG emerges ---- */
    @keyframes mergeCard {
      0%, 25%  { opacity: 0; }
      27%      { opacity: 1; }
      94%      { opacity: 1; }
      98%,100% { opacity: 0; }
    }
    .mergeCard { animation: mergeCard 8s linear infinite; }
    @keyframes mergeArrow {
      0%, 28%  { stroke-dashoffset: 90; opacity: 0; }
      29%      { stroke-dashoffset: 84; opacity: 1; }
      34%      { stroke-dashoffset: 0;  opacity: 1; }
      94%      { stroke-dashoffset: 0;  opacity: 1; }
      98%,100% { stroke-dashoffset: 90; opacity: 0; }
    }
    .mergeArrow { animation: mergeArrow 8s linear infinite; }
    @keyframes planEmit {
      0%, 35%  { opacity: 0; }
      37%      { opacity: 1; }
      94%      { opacity: 1; }
      98%,100% { opacity: 0; }
    }
    #planEmit { animation: planEmit 8s linear infinite; }
    @keyframes planN1 {
      0%, 37%  { opacity: 0; transform: translateY(-14px); }
      40%      { opacity: 1; transform: translateY(0); }
      94%      { opacity: 1; transform: translateY(0); }
      98%,100% { opacity: 0; transform: translateY(-14px); }
    }
    @keyframes planN2 {
      0%, 39%  { opacity: 0; transform: translateY(-14px); }
      42%      { opacity: 1; transform: translateY(0); }
      94%      { opacity: 1; transform: translateY(0); }
      98%,100% { opacity: 0; transform: translateY(-14px); }
    }
    @keyframes planN3 {
      0%, 44%  { opacity: 0; transform: translateY(-14px); }
      47%      { opacity: 1; transform: translateY(0); }
      94%      { opacity: 1; transform: translateY(0); }
      98%,100% { opacity: 0; transform: translateY(-14px); }
    }
    #planN1 { animation: planN1 8s linear infinite; }
    #planN2 { animation: planN2 8s linear infinite; }
    #planN3 { animation: planN3 8s linear infinite; }
    @keyframes planEdge {
      0%, 42%  { stroke-dashoffset: 140; opacity: 0; }
      43%      { stroke-dashoffset: 130; opacity: 1; }
      47%      { stroke-dashoffset: 0;   opacity: 1; }
      94%      { stroke-dashoffset: 0;   opacity: 1; }
      98%,100% { stroke-dashoffset: 140; opacity: 0; }
    }
    .planEdge { animation: planEdge 8s linear infinite; }

    /* ---- EXECUTE: tasks light in dependency order ---- */
    @keyframes exec1 {
      0%, 52%  { opacity: 0; }
      54%      { opacity: 1; }
      94%      { opacity: 1; }
      98%,100% { opacity: 0; }
    }
    @keyframes exec2 {
      0%, 55%  { opacity: 0; }
      57%      { opacity: 1; }
      94%      { opacity: 1; }
      98%,100% { opacity: 0; }
    }
    @keyframes execEdge {
      0%, 59%  { opacity: 0; }
      61%      { opacity: 1; }
      94%      { opacity: 1; }
      98%,100% { opacity: 0; }
    }
    @keyframes exec3 {
      0%, 62%  { opacity: 0; }
      64%      { opacity: 1; }
      94%      { opacity: 1; }
      98%,100% { opacity: 0; }
    }
    #exec1 { animation: exec1 8s linear infinite; }
    #exec2 { animation: exec2 8s linear infinite; }
    .execEdge { animation: execEdge 8s linear infinite; }
    #exec3 { animation: exec3 8s linear infinite; }

    /* ---- COORDINATE: one final architect integration turn ---- */
    @keyframes coordArch {
      0%, 76%  { opacity: 0; }
      78%      { opacity: 1; }
      94%      { opacity: 1; }
      98%,100% { opacity: 0; }
    }
    #coordArch { animation: coordArch 8s linear infinite; }
    @keyframes coordEmit {
      0%, 79%  { opacity: 0; }
      81%      { opacity: 1; }
      94%      { opacity: 1; }
      98%,100% { opacity: 0; }
    }
    #coordEmit { animation: coordEmit 8s linear infinite; }
    @keyframes coordCard {
      0%, 83%  { opacity: 0; transform: translateY(14px); }
      87%      { opacity: 1; transform: translateY(0); }
      94%      { opacity: 1; transform: translateY(0); }
      98%,100% { opacity: 0; transform: translateY(14px); }
    }
    #coordCard { animation: coordCard 8s linear infinite; }
  </style>

  <!-- background -->
  <rect width="1920" height="1080" fill="#08090d"/>

  <!-- title -->
  <text class="t" x="70" y="120" font-size="52" font-weight="700" fill="#eef1f6">/fh-collaborate</text>

  <!-- phase panels -->
  <g>
    <rect x="70"   y="210" width="420" height="670" rx="18" fill="#0d1016" stroke="#1b212c" stroke-width="3"/>
    <rect x="523"  y="210" width="420" height="670" rx="18" fill="#0d1016" stroke="#1b212c" stroke-width="3"/>
    <rect x="976"  y="210" width="420" height="670" rx="18" fill="#0d1016" stroke="#1b212c" stroke-width="3"/>
    <rect x="1429" y="210" width="420" height="670" rx="18" fill="#0d1016" stroke="#1b212c" stroke-width="3"/>
  </g>

  <!-- highlight band (sweeps across phases) -->
  <g id="band">
    <rect x="70" y="210" width="420" height="670" rx="18" fill="#38bdf8" opacity="0.06"/>
    <rect x="92" y="210" width="376" height="6" rx="3" fill="#38bdf8" opacity="0.9"/>
  </g>

  <!-- phase labels -->
  <text class="t" x="280"  y="276" font-size="30" font-weight="700" fill="#eef1f6" text-anchor="middle" letter-spacing="4">PROPOSE</text>
  <text class="t" x="733"  y="276" font-size="30" font-weight="700" fill="#eef1f6" text-anchor="middle" letter-spacing="4">PLAN</text>
  <text class="t" x="1186" y="276" font-size="30" font-weight="700" fill="#eef1f6" text-anchor="middle" letter-spacing="4">EXECUTE</text>
  <text class="t" x="1639" y="276" font-size="26" font-weight="700" fill="#eef1f6" text-anchor="middle" letter-spacing="3">COORDINATE</text>

  <!-- gap chevrons -->
  <text class="t" x="506"  y="558" font-size="26" font-weight="700" fill="#38bdf8" text-anchor="middle">&#9656;</text>
  <text class="t" x="959"  y="558" font-size="26" font-weight="700" fill="#38bdf8" text-anchor="middle">&#9656;</text>
  <text class="t" x="1412" y="558" font-size="26" font-weight="700" fill="#38bdf8" text-anchor="middle">&#9656;</text>

  <!-- ================= PHASE 1: PROPOSE (every agent plans read-only, in parallel) ================= -->
  <g>
    <!-- model chips -->
    <rect x="100" y="352" width="130" height="56" rx="12" fill="#0f131a" stroke="#F59E0B" stroke-width="3.5"/>
    <text class="t" x="165" y="388" font-size="21" font-weight="700" fill="#F59E0B" text-anchor="middle">&#9650; MAIN</text>
    <rect x="100" y="472" width="130" height="56" rx="12" fill="#0f131a" stroke="#22D3EE" stroke-width="3.5"/>
    <text class="t" x="165" y="508" font-size="21" font-weight="700" fill="#22D3EE" text-anchor="middle">&#9679; B2</text>
    <rect x="100" y="592" width="130" height="56" rx="12" fill="#0f131a" stroke="#34D399" stroke-width="3.5"/>
    <text class="t" x="165" y="628" font-size="21" font-weight="700" fill="#34D399" text-anchor="middle">&#9679; B3</text>

    <!-- proposal cards (fired in parallel) -->
    <g id="propA">
      <rect x="300" y="335" width="150" height="90" rx="10" fill="#0f131a" stroke="#F59E0B" stroke-width="3.5"/>
      <rect x="318" y="355" width="104" height="5" rx="2.5" fill="#F59E0B" opacity="0.55"/>
      <rect x="318" y="375" width="116" height="5" rx="2.5" fill="#F59E0B" opacity="0.55"/>
      <rect x="318" y="395" width="82"  height="5" rx="2.5" fill="#F59E0B" opacity="0.55"/>
    </g>
    <g id="propB">
      <rect x="300" y="455" width="150" height="90" rx="10" fill="#0f131a" stroke="#22D3EE" stroke-width="3.5"/>
      <rect x="318" y="475" width="104" height="5" rx="2.5" fill="#22D3EE" opacity="0.55"/>
      <rect x="318" y="495" width="116" height="5" rx="2.5" fill="#22D3EE" opacity="0.55"/>
      <rect x="318" y="515" width="82"  height="5" rx="2.5" fill="#22D3EE" opacity="0.55"/>
    </g>
    <g id="propC">
      <rect x="300" y="575" width="150" height="90" rx="10" fill="#0f131a" stroke="#34D399" stroke-width="3.5"/>
      <rect x="318" y="595" width="104" height="5" rx="2.5" fill="#34D399" opacity="0.55"/>
      <rect x="318" y="615" width="116" height="5" rx="2.5" fill="#34D399" opacity="0.55"/>
      <rect x="318" y="635" width="82"  height="5" rx="2.5" fill="#34D399" opacity="0.55"/>
    </g>

    <!-- read-only tag -->
    <g id="roLbl">
      <rect x="210" y="768" width="24" height="20" rx="4" fill="none" stroke="#38bdf8" stroke-width="3"/>
      <path d="M 215 768 v-7 a 7 7 0 0 1 14 0 v7" fill="none" stroke="#38bdf8" stroke-width="3"/>
      <text class="t" x="248" y="785" font-size="21" font-weight="700" fill="#38bdf8">READ-ONLY</text>
    </g>
  </g>

  <!-- ================= PHASE 2: PLAN (architect merges every proposal into ONE delegation DAG) ================= -->
  <g>
    <!-- the three proposals arrive -->
    <g class="mergeCard">
      <rect x="577" y="306" width="46" height="34" rx="6" fill="#0f131a" stroke="#F59E0B" stroke-width="3"/>
      <rect x="585" y="316" width="30" height="4" rx="2" fill="#F59E0B" opacity="0.6"/>
      <rect x="585" y="326" width="22" height="4" rx="2" fill="#F59E0B" opacity="0.6"/>
    </g>
    <g class="mergeCard">
      <rect x="710" y="306" width="46" height="34" rx="6" fill="#0f131a" stroke="#22D3EE" stroke-width="3"/>
      <rect x="718" y="316" width="30" height="4" rx="2" fill="#22D3EE" opacity="0.6"/>
      <rect x="718" y="326" width="22" height="4" rx="2" fill="#22D3EE" opacity="0.6"/>
    </g>
    <g class="mergeCard">
      <rect x="843" y="306" width="46" height="34" rx="6" fill="#0f131a" stroke="#34D399" stroke-width="3"/>
      <rect x="851" y="316" width="30" height="4" rx="2" fill="#34D399" opacity="0.6"/>
      <rect x="851" y="326" width="22" height="4" rx="2" fill="#34D399" opacity="0.6"/>
    </g>

    <!-- converge into the architect -->
    <line class="mergeArrow" x1="600" y1="348" x2="712" y2="410" stroke="#A78BFA" stroke-width="4" stroke-dasharray="90" stroke-linecap="round"/>
    <line class="mergeArrow" x1="733" y1="348" x2="733" y2="402" stroke="#A78BFA" stroke-width="4" stroke-dasharray="90" stroke-linecap="round"/>
    <line class="mergeArrow" x1="866" y1="348" x2="754" y2="410" stroke="#A78BFA" stroke-width="4" stroke-dasharray="90" stroke-linecap="round"/>

    <!-- architect -->
    <rect x="703" y="410" width="60" height="60" rx="8" transform="rotate(45 733 440)" fill="#0f131a" stroke="#A78BFA" stroke-width="4"/>
    <text class="t" x="733" y="451" font-size="28" fill="#A78BFA" text-anchor="middle">&#9670;</text>
    <text class="t" x="795" y="449" font-size="20" font-weight="700" fill="#A78BFA" letter-spacing="2">ARCHITECT</text>

    <!-- ONE delegation DAG emerges -->
    <line id="planEmit" x1="733" y1="488" x2="733" y2="524" stroke="#A78BFA" stroke-width="3.5" stroke-dasharray="4 8" stroke-linecap="round"/>
    <g id="planN1">
      <rect x="577" y="540" width="110" height="64" rx="12" fill="#0f131a" stroke="#A78BFA" stroke-width="3.5"/>
      <text class="t" x="632" y="582" font-size="26" font-weight="700" fill="#eef1f6" text-anchor="middle">1.a</text>
    </g>
    <g id="planN2">
      <rect x="577" y="700" width="110" height="64" rx="12" fill="#0f131a" stroke="#A78BFA" stroke-width="3.5"/>
      <text class="t" x="632" y="742" font-size="26" font-weight="700" fill="#eef1f6" text-anchor="middle">1.b</text>
    </g>
    <line class="planEdge" x1="687" y1="572" x2="783" y2="642" stroke="#A78BFA" stroke-width="3.5" stroke-dasharray="140" stroke-linecap="round"/>
    <line class="planEdge" x1="687" y1="732" x2="783" y2="662" stroke="#A78BFA" stroke-width="3.5" stroke-dasharray="140" stroke-linecap="round"/>
    <g id="planN3">
      <rect x="787" y="620" width="110" height="64" rx="12" fill="#0f131a" stroke="#A78BFA" stroke-width="3.5"/>
      <text class="t" x="842" y="662" font-size="26" font-weight="700" fill="#eef1f6" text-anchor="middle">2.a</text>
    </g>
  </g>

  <!-- ================= PHASE 3: EXECUTE (tasks run on dependency readiness) ================= -->
  <g>
    <!-- base DAG (queued) -->
    <rect x="1037" y="430" width="110" height="64" rx="12" fill="#0f131a" stroke="#1b212c" stroke-width="3"/>
    <text class="t" x="1079" y="472" font-size="26" font-weight="700" fill="#eef1f6" text-anchor="middle">1.a</text>
    <rect x="1037" y="600" width="110" height="64" rx="12" fill="#0f131a" stroke="#1b212c" stroke-width="3"/>
    <text class="t" x="1079" y="642" font-size="26" font-weight="700" fill="#eef1f6" text-anchor="middle">1.b</text>
    <line x1="1147" y1="462" x2="1237" y2="537" stroke="#1b212c" stroke-width="3" stroke-linecap="round"/>
    <line x1="1147" y1="632" x2="1237" y2="557" stroke="#1b212c" stroke-width="3" stroke-linecap="round"/>
    <rect x="1237" y="515" width="110" height="64" rx="12" fill="#0f131a" stroke="#1b212c" stroke-width="3"/>
    <text class="t" x="1279" y="557" font-size="26" font-weight="700" fill="#eef1f6" text-anchor="middle">2.a</text>

    <!-- light-up overlays in dependency order -->
    <g id="exec1">
      <rect x="1037" y="430" width="110" height="64" rx="12" fill="#3FBF6F" fill-opacity="0.14" stroke="#3FBF6F" stroke-width="4"/>
      <text class="t" x="1125" y="470" font-size="24" font-weight="700" fill="#3FBF6F" text-anchor="middle">&#10003;</text>
    </g>
    <g id="exec2">
      <rect x="1037" y="600" width="110" height="64" rx="12" fill="#3FBF6F" fill-opacity="0.14" stroke="#3FBF6F" stroke-width="4"/>
      <text class="t" x="1125" y="640" font-size="24" font-weight="700" fill="#3FBF6F" text-anchor="middle">&#10003;</text>
    </g>
    <line class="execEdge" x1="1147" y1="462" x2="1237" y2="537" stroke="#3FBF6F" stroke-width="4" stroke-linecap="round"/>
    <line class="execEdge" x1="1147" y1="632" x2="1237" y2="557" stroke="#3FBF6F" stroke-width="4" stroke-linecap="round"/>
    <g id="exec3">
      <rect x="1237" y="515" width="110" height="64" rx="12" fill="#3FBF6F" fill-opacity="0.14" stroke="#3FBF6F" stroke-width="4"/>
      <text class="t" x="1325" y="555" font-size="24" font-weight="700" fill="#3FBF6F" text-anchor="middle">&#10003;</text>
    </g>
  </g>

  <!-- ================= PHASE 4: COORDINATE (one final architect integration turn) ================= -->
  <g>
    <g id="coordArch">
      <rect x="1609" y="420" width="60" height="60" rx="8" transform="rotate(45 1639 450)" fill="#0f131a" stroke="#A78BFA" stroke-width="4"/>
      <text class="t" x="1639" y="461" font-size="28" fill="#A78BFA" text-anchor="middle">&#9670;</text>
      <text class="t" x="1639" y="386" font-size="20" font-weight="700" fill="#A78BFA" text-anchor="middle" letter-spacing="2">ARCHITECT</text>
    </g>
    <line id="coordEmit" x1="1639" y1="498" x2="1639" y2="540" stroke="#A78BFA" stroke-width="3.5" stroke-dasharray="4 8" stroke-linecap="round"/>
    <g id="coordCard">
      <rect x="1554" y="556" width="170" height="100" rx="10" fill="#0f131a" stroke="#3FBF6F" stroke-width="3.5"/>
      <rect x="1572" y="578" width="112" height="5" rx="2.5" fill="#3FBF6F" opacity="0.55"/>
      <rect x="1572" y="598" width="124" height="5" rx="2.5" fill="#3FBF6F" opacity="0.55"/>
      <rect x="1572" y="618" width="90"  height="5" rx="2.5" fill="#3FBF6F" opacity="0.55"/>
      <text class="t" x="1700" y="588" font-size="24" font-weight="700" fill="#3FBF6F" text-anchor="middle">&#10003;</text>
      <text class="t" x="1639" y="706" font-size="21" font-weight="700" fill="#A78BFA" text-anchor="middle">FINAL INTEGRATION</text>
    </g>
  </g>
</svg>
