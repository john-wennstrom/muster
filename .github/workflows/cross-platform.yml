name: Cross-platform CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.os }} / Node 22 / Bun 1.4.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun 1.4.0
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate CI workflow
        run: bun run ci:validate

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit and integration tests
        run: bun run ci:test

      - name: Run extension installation smoke test
        run: bun run test:extension-smoke

      - name: Run Git and worktree contract tests
        run: bun run test:git-worktree

      - name: Run host-runner contract tests
        run: bun run test:host-runner