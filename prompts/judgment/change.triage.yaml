decision: "change.triage"
questions:
  - id: "disposition"
    type: "choice"
    instructions: "Given the request and the candidate files in the state, what should planning do? Choose already_satisfied only when the candidates show that the code already does what the request asks. A candidate that only mentions the same names or sits in the same area does not satisfy the request. Choose needs_clarification only when the request is too ambiguous to bound a plan, not merely because it is large."
    criteria:
      "proceed": "The request asks for work the code does not already do, and it is specific enough to plan."
      "needs_clarification": "The request is too ambiguous to bound a plan without asking the user one question."
      "already_satisfied": "The code shown already does what the request asks."
  - repeat: "candidates"
    questions:
      - id: "candidate_{{index}}_implements"
        type: "noul"
        instructions: "Does candidate {{index}}, the entry with index {{index}} in the state's candidates list, already implement what the request asks for, so that the requested behavior exists there today? A file that only mentions the same names, sits in the same area, or would need to be changed to deliver the request answers no."
      - id: "candidate_{{index}}_needs_change"
        type: "noul"
        instructions: "Would candidate {{index}}, the entry with index {{index}} in the state's candidates list, need to be modified to carry out the request? A file that already implements the request without needing a change, or that only mentions the same names, answers no."

  - id: "public_contract"
    type: "noul"
    instructions: "Does the request change an externally observable interface that code outside the changed component depends on, such as a public API, a command-line surface, a file or wire format, a configuration schema, or a protocol between two processes? Changing an internal function signature, a private helper, or the internals of one module is not a public contract change and answers no."
  - id: "data_migration"
    type: "noul"
    instructions: "Does carrying out the request require migrating existing stored data to a new shape or location? A request that explicitly avoids a migration, such as one that says not to migrate the data or to keep existing data as it is, answers no. Adding something that existing data does not need to be rewritten for is not a migration."
  - id: "security_boundary"
    type: "noul"
    instructions: "Does the request change what an actor is allowed to do, or what the system trusts: authentication, authorization, permissions, credential handling, or the validation of untrusted input? Work that merely touches code near such logic without changing what is allowed or trusted answers no."
  - id: "design_ambiguity"
    type: "noul"
    instructions: "Would two or more materially different, mutually incompatible designs each be a reasonable reading of this request, so that a design decision must be made before the work can be planned? A request with one obvious approach, or with a stated approach, answers no."
  - id: "mechanical"
    type: "noul"
    instructions: "Does the change follow a pattern the request already states or the evidence already shows, so that it can be carried out without any design judgment, such as a rename or applying an existing convention to more places?"
  - id: "reach"
    type: "score"
    instructions: "How far does the change reach beyond the place where it is made?"
    criteria:
      - "Confined to one function or one file, with no effect on callers."
      - "Affects the callers within one module or capability."
      - "Affects several modules or capabilities inside this repository."
      - "Affects consumers outside this repository, or the way the whole system operates."
